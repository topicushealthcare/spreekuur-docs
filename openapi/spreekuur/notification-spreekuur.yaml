openapi: 3.0.3
info:
  title: Spreekuur.nl Notification FHIR API
  version: 1.0.0

paths:
  /Communication:
    post:
      summary: Send a notification to a patient
      description: >
        Endpoint used by the XIS to send a one-way notification to a patient in Spreekuur.nl.
        Only `Communication` resources with category code `melding` are supported.
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Communication'
      responses:
        '201':
          description: Notification created successfully
        '400':
          description: Invalid request, for example when the category is missing or not supported
        '422':
          description: >
            The notification could not be processed, for example when the contained Patient holds neither a BSN nor a
            Spreekuur.nl patient id, holds both of them, or when the Spreekuur.nl patient id is not a valid UUID.

components:
  schemas:
    Communication:
      type: object
      required: [ resourceType, status, payload, recipient, category, topic, contained ]
      properties:
        resourceType:
          type: string
          enum: [ Communication ]
          example: Communication
        contained:
          type: array
          description: Contains the Patient resource referenced by `Communication.recipient`.
          items:
            oneOf:
              - $ref: '#/components/schemas/Patient'
        topic:
          type: object
          description: The subject of the notification shown to the patient.
          properties:
            text:
              type: string
              maxLength: 500
              example: "Lab results available"
        status:
          type: string
          enum: [ completed ]
          example: completed
        category:
          type: array
          description: The category will be used by Spreekuur.nl to differentiate between chat messages and notifications.
          items:
            type: object
            properties:
              coding:
                type: array
                items:
                  type: object
                  properties:
                    system:
                      type: string
                      example: "nl.spreekuur.communication-category"
                    code:
                      type: string
                      example: "melding"
        payload:
          type: array
          description: >
            The notification content shown to the patient. One entry holds the message text (`contentString`).
            Optionally, up to 5 additional entries may each hold an attachment (`contentAttachment`).
          items:
            type: object
            properties:
              contentString:
                type: string
                minLength: 1
                maxLength: 10000
                example: "Your lab results are available."
              contentAttachment:
                $ref: '#/components/schemas/Attachment'
        recipient:
          type: array
          description: References the contained Patient resource that should receive the notification.
          items:
            type: object
            required: [ reference ]
            properties:
              reference:
                description: Reference to the Patient resource contained in this Communication
                type: string
                example: "#9876543210"
    Attachment:
      type: object
      description: >
        An attachment sent along with the notification. A notification may contain at most 5 attachments.
      required: [ data, contentType, title ]
      properties:
        data:
          type: string
          format: byte
          description: The file contents, base64-encoded.
        contentType:
          type: string
          description: >
            The MIME type of the file. Allowed values are `application/pdf`, `image/jpeg`, `image/png`,
            `application/msword`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`,
            `application/vnd.ms-excel` and
            `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`.
          example: "application/pdf"
        title:
          type: string
          description: The file name shown to the patient and used as the download file name.
          example: "lab-results.pdf"
    Patient:
      type: object
      required: [ resourceType, id, identifier ]
      properties:
        resourceType:
          type: string
          enum: [ Patient ]
          example: Patient
        id:
          type: string
          example: "9876543210"
        identifier:
          type: array
          description: >
            Exactly one patient identifier is required: either a BSN
            (`http://fhir.nl/fhir/NamingSystem/bsn`) or the Spreekuur.nl patient id
            (`http://spreekuur.nl/fhir/NamingSystem/patientIdpId`), formatted as a UUID. Sending both is rejected.
          items:
            type: object
            required: [ system, value ]
            properties:
              system:
                type: string
                enum:
                  - "http://fhir.nl/fhir/NamingSystem/bsn"
                  - "http://spreekuur.nl/fhir/NamingSystem/patientIdpId"
                example: "http://fhir.nl/fhir/NamingSystem/bsn"
              value:
                type: string
                example: 123456782
        telecom:
          type: array
          description: When a patient is not yet registered at Spreekuur.nl, an email address can be provided which will be used to send an invitation to register.
          items:
            type: object
            properties:
              system:
                type: string
                enum: [ email ]
                example: email
              value:
                type: string
                example: "jan.janssen@example.com"
